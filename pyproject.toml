[project]
name = "itc-sentinel"
version = "0.1.0"
description = "ITC Sentinel — GST Input Tax Credit reconciliation MVP"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]


[tool.setuptools.packages.find]
where = ["src"]
